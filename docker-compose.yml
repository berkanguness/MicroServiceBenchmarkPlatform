services:
  postgres:
    image: postgres:17-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD}
    ports:
        - "127.0.0.1:5432:5432"
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lab-pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: lab-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: lab-cadvisor
    command:
      - "--docker=unix:///rootfs/run/docker.sock"
      - "--containerd=/rootfs/run/containerd/containerd.sock"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lab-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD .env içinde tanımlı olmalı}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - lab-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    cpus: 0.5
    mem_limit: 512m

volumes:
  lab-pgdata:
  lab-grafana-data: