services:
  postgres:
    image: postgres:17-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD}
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lab-pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: lab-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
      
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lab-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"

volumes:
  lab-pgdata: