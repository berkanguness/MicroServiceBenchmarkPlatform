syntax = "proto3";

package hospital;

option java_package = "com.benchmark.proto";
option java_multiple_files = true;

message PatientRequest {
  int64 patient_id = 1;
}

message LabItemResponse {
  int64 id = 1;
  string test_code = 2;
  string test_name = 3;
  double result_value = 4;
  string unit = 5;
  bool is_critical = 6;
  double reference_min = 7;
  double reference_max = 8;
  string technician_notes = 9;
}

message PatientLabHistoryResponse {
  int64 patient_id = 1;
  repeated LabItemResponse items = 2;
}

service LabService {
  rpc GetPatientLabHistory (PatientRequest) returns (PatientLabHistoryResponse);
}