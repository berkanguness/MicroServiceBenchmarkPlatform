# LabResultService — default profile (contract §8.1). Management, probes, /actuator/info and metrics keys since P6
# (§8.1, §8.3, §11). Benchmark settings live in application-bench.yaml, the monitoring-off overlay in
# application-bench-nomon.yaml.
spring:
  application:
    name: lab-result-service
  threads:
    virtual:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:labdb}?reWriteBatchedInserts=true
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:lab}
    hikari:
      pool-name: lab-hikari
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 2000
      # Must stay below connection-timeout: Hikari does not clamp its default (5000), so a hung database would
      # cost ~5 s per acquisition instead of 2 s (chaos finding F3). Hikari's minimum is 250.
      validation-timeout: 1000
      max-lifetime: 1800000
      # Chaos F1: pgjdbc socketTimeout (seconds) is a socket READ INACTIVITY timeout (Socket.setSoTimeout), not a
      # statement-duration limit: it ends a read that receives no bytes for that long, e.g. against a hung/partitioned
      # database, which the shared service reports as UNAVAILABLE (F2). A whole call can take longer (pool acquisition,
      # several round trips, slowly progressing reads); size every protocol's client timeout equally and above the
      # whole service-call budget. 0 disables it. Well above the slowest legitimate statement (ms). Passed as a driver
      # property, so it also applies when a test's @ServiceConnection supplies the URL. No server-side
      # statement_timeout (contract §5.5); no retries.
      data-source-properties:
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:5}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        query:
          in_clause_parameter_padding: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
        cache:
          use_second_level_cache: false
          use_query_cache: false
  flyway:
    enabled: true
  # P5 GraphQL (contract §7.2, §8.1): POST /graphql on 8080. Introspection and GraphiQL are off by default and in bench;
  # only the "docs" profile (application-docs.yaml, for humans, never a benchmark profile) turns them on.
  graphql:
    http:
      path: /graphql
    schema:
      introspection:
        enabled: false
    graphiql:
      enabled: false
  grpc:
    server:
      port: 9091

server:
  port: 8080
  tomcat:
    threads:
      max: 200

# P6 (contract §8.1, §8.3, §11): actuator on its own port. management.server.port starts a child context with its own
# Tomcat and thread pool (R7; shares the CPU), so 8080 serves no /actuator/** at all. Exposed: health (with the
# liveness/readiness probe groups), info (§11.2, LabInfoContributor) and prometheus (§11.1). Every meter carries the
# common tag application="lab-result-service". No percentile histograms (k6 is the source of truth for p95/p99).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  metrics:
    tags:
      application: lab-result-service
  prometheus:
    metrics:
      export:
        enabled: true

# P2 dataset seeding and verification (contract §6.6, §6.7, §8.1), bound by seed.DatasetProperties.
# P4 CORS (contract §8.1 R3), read by config.CorsConfig: comma-separated origins, empty = CORS off. Ignored under the
# bench/bench-nomon profiles (CorsConfig is @Profile("!bench & !bench-nomon")).
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  seed:
    enabled: false
  dataset:
    verify-mode: ${APP_DATASET_VERIFY_MODE:cheap}
