# LabResultService — default profile (contract §8.1). Keys of later phases (GraphQL, management/metrics, CORS,
# seeding, verification) are added by the phase that introduces them.
spring:
  application:
    name: lab-result-service
  threads:
    virtual:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:labdb}?reWriteBatchedInserts=true
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:lab}
    hikari:
      pool-name: lab-hikari
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 2000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        query:
          in_clause_parameter_padding: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
        cache:
          use_second_level_cache: false
          use_query_cache: false
  flyway:
    enabled: true
  grpc:
    server:
      port: 9091

server:
  port: 8080
  tomcat:
    threads:
      max: 200
