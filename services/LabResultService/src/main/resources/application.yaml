# LabResultService — default profile (contract §8.1). Keys of later phases (GraphQL, management/metrics, CORS,
# seeding, verification) are added by the phase that introduces them.
spring:
  application:
    name: lab-result-service
  threads:
    virtual:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:labdb}?reWriteBatchedInserts=true
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:lab}
    hikari:
      pool-name: lab-hikari
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 2000
      # Must stay below connection-timeout: Hikari does not clamp its default (5000), so a hung database would
      # cost ~5 s per acquisition instead of 2 s (chaos finding F3). Hikari's minimum is 250.
      validation-timeout: 1000
      max-lifetime: 1800000
      # Chaos F1: pgjdbc socketTimeout (seconds) is a socket READ INACTIVITY timeout (Socket.setSoTimeout), not a
      # statement-duration limit: it ends a read that receives no bytes for that long, e.g. against a hung/partitioned
      # database, which the shared service reports as UNAVAILABLE (F2). A whole call can take longer (pool acquisition,
      # several round trips, slowly progressing reads); size every protocol's client timeout equally and above the
      # whole service-call budget. 0 disables it. Well above the slowest legitimate statement (ms). Passed as a driver
      # property, so it also applies when a test's @ServiceConnection supplies the URL. No server-side
      # statement_timeout (contract §5.5); no retries.
      data-source-properties:
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:5}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        query:
          in_clause_parameter_padding: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
        cache:
          use_second_level_cache: false
          use_query_cache: false
  flyway:
    enabled: true
  grpc:
    server:
      port: 9091

server:
  port: 8080
  tomcat:
    threads:
      max: 200

# P2 dataset seeding and verification (contract §6.6, §6.7, §8.1), bound by seed.DatasetProperties.
app:
  seed:
    enabled: false
  dataset:
    verify-mode: ${APP_DATASET_VERIFY_MODE:cheap}
